databases:
  - name: chamalink-db
    databaseName: chamalink
    user: chamalink
    region: frankfurt
    plan: free

services:
  - type: web
    name: chamalink
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate && python manage.py seed_demo && python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chamalink-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: CHAMALINK_DEMO_MODE
        value: "true"
      - key: DEMO_USERNAME
        sync: false
      - key: DEMO_PASSWORD
        sync: false
