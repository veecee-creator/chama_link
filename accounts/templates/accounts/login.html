{% load static %}

{% load static socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="48x48" href="{% static 'groups/logo/app-icon-48.png' %}">
    <link rel="apple-touch-icon" href="{% static 'groups/logo/app-icon-180.png' %}">
    <link rel="manifest" href="{% static 'groups/logo/manifest.json' %}">
    <meta name="theme-color" content="#101828">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome back | ChamaLink</title>
    <link rel="stylesheet" href="{% static 'accounts/auth.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="logo">ChamaLink</div>
        <p class="subtitle">Welcome back! Sign in to continue.</p>

        <h1>Login to Your Account</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        {% if google_oauth_enabled %}
        <div class="auth-divider"><span>or</span></div>
        <form method="post" action="{% provider_login_url 'google' %}">{% csrf_token %}<button class="google-button" type="submit"><span>G</span> Continue with Google</button></form>
        {% endif %}

        <div class="auth-links">
            Don't have an account?
            <a href="{% url 'register' %}">Register</a>

            <br>

            <a class="dashboard-link" href="{% url 'landing' %}">
                Back to ChamaLink
            </a>
        </div>
    </div>
</body>
</html>
